[package]
name = "lantern"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"]}
uuid = { version = "1", features = ["v4"]}
serde = { version = "1", features = ["derive"]}
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
